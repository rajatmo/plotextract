eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
rfd.workspace = true
clap.workspace = true
kurbo.workspace = true
image.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
