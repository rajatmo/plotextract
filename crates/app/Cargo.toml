[package]
name = "plotextract"
description = "Pick curves from plots in PDF, PostScript, SVG and raster images and export them in plot units"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
plotextract-ui.workspace = true
plotextract-model.workspace = true
plotextract-usecases.workspace = true
plotextract-pdf.workspace = true
plotextract-ps.workspace = true
plotextract-svg.workspace = true
plotextract-image.workspace = true
plotextract-arxiv.workspace = true
plotextract-fs.workspace = true
plotextract-ticks.workspace = true
clap.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

