[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Rajat Mandal"]

[profile.release]
lto = "thin"
strip = "symbols"

[workspace.dependencies]
# internal crates
plotextract-core = { path = "crates/core" }
plotextract-import = { path = "crates/import" }
plotextract-workspace = { path = "crates/workspace" }
plotextract-pdf = { path = "crates/pdf" }
plotextract-ps = { path = "crates/ps" }
plotextract-svg = { path = "crates/svg" }
plotextract-raster = { path = "crates/raster" }
plotextract-arxiv = { path = "crates/arxiv" }

# PDF
hayro = "0.8"
hayro-interpret = "0.8"
hayro-syntax = "0.8"

# PostScript / EPS
stet = "0.9"
stet-fonts = "0.9"

# SVG
usvg = "0.49"
resvg = "0.49"

# geometry
kurbo = "0.13"

# raster
image = "0.25"
imageproc = "0.27"
lsdetect = "0.4"
rayon = "1.12"

# arXiv sources: the download and the archive
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
flate2 = "1.1"
tar = "0.4.46"

# Windows executable icon
winresource = "0.1"

# UI
egui_extras = { version = "0.37", default-features = false }
eframe = "0.37"
egui = "0.37"
rfd = "0.17"

# glue
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
