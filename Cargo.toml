[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/algo",
    "crates/ports",
    "crates/usecases",
    "crates/model",
    "crates/ui",
    "crates/app",
    "crates/corpus",
    "crates/adapters/import",
    "crates/adapters/pdf",
    "crates/adapters/ps",
    "crates/adapters/svg",
    "crates/adapters/image",
    "crates/adapters/arxiv",
    "crates/adapters/fs",
    "crates/adapters/ticks",
]

[workspace.package]
version = "1.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Rajat Mandal"]

[profile.release]
lto = "thin"
strip = "symbols"

# the tick networks are a hundred times slower unoptimized: a debug build optimizes the crates that run them
[profile.dev.package.tract-core]
opt-level = 3
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-data]
opt-level = 3
[profile.dev.package.ndarray]
opt-level = 3

[workspace.dependencies]
# internal crates, from the inside out
plotextract-domain = { path = "crates/domain" }
plotextract-algo = { path = "crates/algo" }
plotextract-ports = { path = "crates/ports" }
plotextract-usecases = { path = "crates/usecases" }
plotextract-model = { path = "crates/model" }
plotextract-ui = { path = "crates/ui" }
# adapters
plotextract-import = { path = "crates/adapters/import" }
plotextract-pdf = { path = "crates/adapters/pdf" }
plotextract-ps = { path = "crates/adapters/ps" }
plotextract-svg = { path = "crates/adapters/svg" }
plotextract-image = { path = "crates/adapters/image" }
plotextract-arxiv = { path = "crates/adapters/arxiv" }
plotextract-fs = { path = "crates/adapters/fs" }
plotextract-ticks = { path = "crates/adapters/ticks" }

# PDF
hayro = "0.8"
hayro-interpret = "0.8"
hayro-syntax = "0.8"

# PostScript / EPS
stet = "0.9"
stet-fonts = "0.9"

# SVG
usvg = "0.49"
resvg = "0.49"

# geometry
kurbo = { version = "0.13", features = ["serde"] }

# raster
image = "0.25"
imageproc = "0.27"
lsdetect = "0.4"
rayon = "1.12"

# the tick networks, run on the CPU
tract-onnx = "0.23.9"

# arXiv sources: the download and the archive
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
flate2 = "1.1"
tar = "0.4.46"

# Windows executable icon
winresource = "0.1"

# UI
eframe = "0.37"
egui = "0.37"
rfd = "0.17"

# glue
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
